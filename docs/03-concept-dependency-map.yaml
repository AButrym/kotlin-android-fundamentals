schema_version: "0.1"
artifact:
  id: "concept-dependency-map"
  title: "Kotlin for Android Fundamentals Concept Dependency Map"
  status: "draft"
  version: "0.1.0"
  last_reviewed: "2026-10-29"
  depends_on:
    - "01-course-contract.md"
    - "02-course-map.yaml"

semantics:
  purpose: >-
    Defines the instructional prerequisites and introduction order for concepts
    used in the course. This is a pedagogical dependency graph, not a complete
    formal model of Kotlin or Android APIs.

  relation_types:
    requires: >-
      Concepts that should already be understood before this concept is taught
      as a new core concept.
    reinforces: >-
      Earlier concepts that should be revisited while teaching this concept.
    enables: >-
      Later concepts or capabilities made easier by this concept.
    related: >-
      Concepts that should be contrasted or connected but are not strict
      prerequisites.

  usage_rules:
    - "A core lesson may assume only concepts introduced in earlier lessons."
    - "A concept introduced in the current lesson may be used after explanation and guided practice."
    - "A future concept may appear only as named scaffolding."
    - "Scaffolded code must be visually and verbally distinguished from code the learner is expected to understand."
    - "Optional concepts must not become hidden prerequisites for core exercises."
    - "When a concept has multiple prerequisites, generators must verify all core prerequisites."
    - "A concept marked recognition_only may be read but need not be independently produced."

levels:
  - id: "recognize"
    description: "Recognize the term or construct in provided code"

  - id: "explain"
    description: "Explain the concept in plain language and trace an example"

  - id: "apply-guided"
    description: "Use the concept with prompts or partial scaffolding"

  - id: "apply-independent"
    description: "Use the concept independently in a familiar problem"

  - id: "integrate"
    description: "Combine the concept with other concepts in a larger solution"

domains:
  programming:
    title: "Programming foundations"
  kotlin:
    title: "Kotlin language"
  compose:
    title: "Jetpack Compose"
  android:
    title: "Android tooling and platform"
  architecture:
    title: "Application architecture"
  tooling:
    title: "Development workflow"
  quality:
    title: "Quality and explanation"

