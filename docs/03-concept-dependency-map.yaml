supporting_concepts:
  - id: "abstraction-intro"
    introduced_in: "L04"
    status: "supporting"
    description: "A useful name and boundary that hides unnecessary detail"
    requires:
      - "decomposition"

  - id: "encapsulation-intro"
    introduced_in: "L05"
    status: "supporting"
    description: "Keeping related state and allowed changes behind a clear boundary"
    requires:
      - "class-declaration"
      - "local-scope"

  - id: "material-component-intro"
    introduced_in: "L02"
    status: "supporting"
    description: "Use ready-made Material UI components consistently"
    requires:
      - "composable-function-intro"

  - id: "collection-iteration"
    introduced_in: "L06"
    status: "supporting"
    description: "Iterate over the elements of a collection"
    requires:
      - "for-loop"
      - "collection"

  - id: "map-operation"
    introduced_in: "L08"
    status: "supporting"
    description: "Transform every element into a corresponding result"
    requires:
      - "collection-transformations"

  - id: "filter-operation"
    introduced_in: "L08"
    status: "supporting"
    description: "Retain collection elements satisfying a predicate"
    requires:
      - "collection-transformations"

  - id: "find-operation"
    introduced_in: "L08"
    status: "supporting"
    description: "Find the first element satisfying a predicate"
    requires:
      - "collection-transformations"
      - "nullable-type"

  - id: "any-operation"
    introduced_in: "L08"
    status: "supporting"
    description: "Check whether at least one element satisfies a predicate"
    requires:
      - "collection-transformations"

  - id: "all-operation"
    introduced_in: "L08"
    status: "supporting"
    description: "Check whether all elements satisfy a predicate"
    requires:
      - "collection-transformations"

  - id: "count-operation"
    introduced_in: "L08"
    status: "supporting"
    description: "Count elements, optionally using a predicate"
    requires:
      - "collection-transformations"

  - id: "map-indexed-intro"
    introduced_in: "L08"
    status: "supporting"
    description: "Transform elements while also using their indices"
    requires:
      - "map-operation"
      - "index"

deferred_concepts:
  - id: "generic-declaration"
    earliest_optional_after: "L08"
    reason: >-
      Learners must read types such as List<Cell>, but declaring generic APIs
      is not required by the final project.

  - id: "variance"
    earliest_optional_after: "L14"
    reason: "Not required for the course outcomes."

  - id: "custom-iterator"
    earliest_optional_after: "L14"
    reason: "Standard collection iteration is sufficient."

  - id: "operator-overloading"
    earliest_optional_after: "L14"
    reason: "Adds syntax without solving a core beginner project problem."

  - id: "infix-functions"
    earliest_optional_after: "L14"
    reason: "Not required to understand or implement the target architecture."

  - id: "delegation"
    earliest_optional_after: "L14"
    reason: "Useful Kotlin feature but not required for the final project."

  - id: "lazy-properties"
    earliest_optional_after: "L14"
    reason: "No core use case justifies classroom time in this course."

  - id: "coroutines"
    earliest_optional_after: "L14"
    reason: "The selected games require no asynchronous work."

  - id: "stateflow"
    earliest_optional_after: "L11"
    reason: >-
      It may be used by an advanced implementation baseline, but it must not
      become a hidden prerequisite.

  - id: "repository-layer"
    earliest_optional_after: "L14"
    reason: "The course has no persistence or remote data source."

  - id: "dependency-injection"
    earliest_optional_after: "L14"
    reason: "The small project does not require a DI framework."

  - id: "room"
    earliest_optional_after: "L14"
    reason: "Persistence is outside the core scope."

  - id: "advanced-navigation"
    earliest_optional_after: "L14"
    reason: "A small explicit screen-state flow is sufficient."

validation:
  invariants:
    - id: "CDM-01"
      rule: "Each core concept must have exactly one introduced_in lesson."

    - id: "CDM-02"
      rule: "A required concept must be introduced earlier than its dependent concept."

    - id: "CDM-03"
      rule: "No deferred concept may be required by a core concept."

    - id: "CDM-04"
      rule: "Every lesson concept ID in 02-course-map.yaml must resolve here."

    - id: "CDM-05"
      rule: "Every concept used in an exercise must be introduced or explicitly scaffolded."

    - id: "CDM-06"
      rule: "Architecture concepts must be motivated by an observed complexity problem."

    - id: "CDM-07"
      rule: "StateFlow, Hilt, Room, and repositories are not core prerequisites."

    - id: "CDM-08"
      rule: "The final architecture must remain explainable through event-update-render-loop."

  generation_failure_conditions:
    - "A generated lesson uses an unresolved concept ID."
    - "A generated lesson requires a concept scheduled for a later lesson."
    - "A code exercise requires a deferred concept without marking it optional."
    - "A lesson introduces ViewModel before state hoisting and UI state."
    - "A lesson introduces collection transformations before functions and lists."
    - "A lesson introduces sealed game state before basic branching, classes, and finite states."
    - "A final project places all game rules inside composables."
    - "A reusable cell component directly owns the complete board state."