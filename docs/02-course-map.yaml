      - "Explains the event-update-render loop"
      - "Supports setup, play, and result states"

final_project:
  introduced_in: "L06"
  baseline_completed_in: "L09"
  architecture_completed_in: "L12"
  student_variant_implemented_in: ["L13", "L14"]

  baseline_game: "Tic-Tac-Toe"

  suggested_variants:
    basic:
      - "Tic-Tac-Toe"
      - "Fifteen puzzle"
      - "Memory matching game"
    intermediate:
      - "Connect Four"
      - "Simplified Reversi"
    advanced:
      - "Reversi"
      - "Simplified Checkers"
      - "Battleship with a handover screen"

  required_architecture_elements:
    - "domain model"
    - "game rules or game engine"
    - "GameUiState"
    - "GameViewModel"
    - "GameScreen"
    - "reusable board component"
    - "reusable cell component"
    - "Material theme"

  prohibited_default_dependencies:
    - "Hilt"
    - "Room"
    - "network libraries"
    - "third-party state-management frameworks"

generation_validation:
  checks:
    - id: "GV-01"
      rule: "Every lesson lasts exactly 120 planned minutes"

    - id: "GV-02"
      rule: "Every lesson contains both Kotlin/programming and Android/Compose work"

    - id: "GV-03"
      rule: "Every new concept has an entry in 03-concept-dependency-map.yaml"

    - id: "GV-04"
      rule: "Every prerequisite concept is introduced in an earlier lesson"

    - id: "GV-05"
      rule: "Future concepts may appear only as explicitly identified scaffolding"

    - id: "GV-06"
      rule: "Every lesson produces an observable result"

    - id: "GV-07"
      rule: "Lessons L06-L14 contribute directly to the grid-game trajectory"

    - id: "GV-08"
      rule: "No infrastructure-heavy framework is introduced into the core path"

    - id: "GV-09"
      rule: "Optional depth is visibly separated from required material"

    - id: "GV-10"
      rule: "Final project content preserves state-down/events-up architecture"